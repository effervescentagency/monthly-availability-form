<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Availability</title><style>body{margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#f9fafb;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{max-width:420px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center}h1{font-size:18px;color:#be185d;margin:0 0 8px}p{font-size:14px;color:#4b5563;line-height:1.6;margin:0}a{display:inline-block;margin-top:16px;background:#ec4899;color:#fff;text-decoration:none;padding:10px 20px;border-radius:10px;font-weight:700}</style></head><body><div class="card"><h1>Availability form</h1><p id="msg">Opening your form...</p><a id="link" href="/">Open the current form</a></div><script>(function(){var M=["january","february","march","april","may","june","july","august","september","october","november","december"];var p=location.pathname;try{p=decodeURIComponent(p)}catch(e){}p=p.toLowerCase().replace(/[_\s]+/g,"-");var m=p.match(/([a-z]+)-(\d{4})/);var tried=/[?&]x=1/.test(location.search);if(m&&M.indexOf(m[1])!==-1&&!tried){location.replace("/"+m[1]+"-"+m[2]+"/?x=1");return}document.getElementById("msg").textContent=tried?"That month's form is not available yet. Tap below for the current form.":"Tap below to open the current availability form."})();</script></body></html>
